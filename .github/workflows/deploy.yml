name: Deploy a produccion

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-produccion
  cancel-in-progress: false

jobs:
  verificar:
    runs-on: ubuntu-latest
    # A nivel de job: con --no-dev los bundles de dev no estan instalados, asi que
    # todo (incluido el cache:clear de composer) tiene que correr en prod.
    env:
      APP_ENV: prod
      APP_SECRET: solo-para-el-lint
    steps:
      - uses: actions/checkout@v4

      # 8.3 para igualar el PHP del server (8.3.33). Con 8.2 composer no resuelve:
      # phpunit 12 y sebastian/* exigen >=8.3.
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: intl, pdo_mysql, gd, zip
          tools: composer

      - run: composer install --no-dev --optimize-autoloader --no-interaction --no-progress

      - name: Lint de YAML, Twig y contenedor
        run: |
          php bin/console lint:yaml config --parse-tags
          php bin/console lint:twig templates
          php bin/console lint:container

      # Se compila aca y no en el server: alla el binario de Tailwind (Bun) no
      # puede cargar lightningcss porque /tmp esta montado noexec.
      - name: Compilar Tailwind
        run: php bin/console tailwind:build --minify

      - uses: actions/upload-artifact@v4
        with:
          name: tailwind-css
          path: var/tailwind/app.built.css
          retention-days: 1

  desplegar:
    needs: verificar
    runs-on: ubuntu-latest
    environment: produccion
    steps:
      - uses: actions/checkout@v4

      - name: Configurar clave SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${{ secrets.SSH_PORT }}" -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts

      - uses: actions/download-artifact@v4
        with:
          name: tailwind-css
          path: dist

      - name: Subir el CSS compilado
        env:
          APP_DIR: domains/atilioautomotores.com/public_html/concesionaria
        run: |
          ssh -i ~/.ssh/deploy_key -p "${{ secrets.SSH_PORT }}" \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            "mkdir -p $APP_DIR/var/tailwind"
          scp -i ~/.ssh/deploy_key -P "${{ secrets.SSH_PORT }}" \
            dist/app.built.css \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:$APP_DIR/var/tailwind/app.built.css"

      # El script se manda por stdin en vez de ejecutarlo desde el server: en el
      # primer deploy todavia no existe alla, y asi siempre corre la version del
      # commit que se esta desplegando.
      - name: Ejecutar deploy
        run: |
          ssh -i ~/.ssh/deploy_key -p "${{ secrets.SSH_PORT }}" \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            'bash -s' < bin/deploy.sh
