name: Deploy a produccion

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-produccion
  cancel-in-progress: false

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: intl, pdo_mysql, gd, zip
          tools: composer

      - run: composer install --no-interaction --no-progress

      - name: Lint de YAML, Twig y contenedor
        env:
          APP_ENV: prod
          APP_SECRET: solo-para-el-lint
        run: |
          php bin/console lint:yaml config --parse-tags
          php bin/console lint:twig templates
          php bin/console lint:container

  desplegar:
    needs: verificar
    runs-on: ubuntu-latest
    environment: produccion
    steps:
      - name: Configurar clave SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${{ secrets.SSH_PORT }}" -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts

      - name: Ejecutar deploy
        run: |
          ssh -i ~/.ssh/deploy_key -p "${{ secrets.SSH_PORT }}" \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            "bash \$HOME/domains/atilioautomotores.com/public_html/concesionaria/bin/deploy.sh"
